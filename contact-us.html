    <script>
      const form = document.getElementById("project-details");
      const formMsg = document.getElementById("form-message");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const formData = new FormData(form);

        fetch("https://api.web3forms.com/submit", {
          method: "POST",
          body: formData,
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.success) {
              showMessage("Your message has been sent successfully!", "green");
              form.reset();
            } else {
              showMessage("Email failed to send. Please try again.", "red");
            }
          })
          .catch((error) => {
            showMessage("Something went wrong!", "red");
          });
      });

      function showMessage(text, color) {
        formMsg.style.display = "block";
        formMsg.style.color = color;
        formMsg.innerHTML = text;

        // Hide message after 10 seconds
        setTimeout(() => {
          formMsg.style.display = "none";
        }, 5000);
      }
    </script>
