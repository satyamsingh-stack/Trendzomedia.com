<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Trendzo Media</title>

  <meta name="description" content="Oops! The page you are looking for does not exist. Return to Trendzo Media homepage or contact us for help." />

  <link rel="icon" type="image/png" href="./asset/image/Logo.png" />

  <link rel="stylesheet" href="./asset/css/style.css" />
  <link rel="stylesheet" href="./asset/css/responsive.css" />

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background: #f8f9fa;
      font-family: Arial, sans-serif;
    }
    .error-box {
      max-width: 500px;
    }
    h1 {
      font-size: 80px;
      color: #dc3545;
    }
    p {
      margin: 15px 0;
      font-size: 18px;
    }
    a {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #007bff;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
    }
    a:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="error-box">
    <h1>404</h1>
    <p>Oops! The page you’re looking for doesn’t exist.</p>
    <p>It might have been moved or deleted.</p>

    <a href="/" rel="noopener noreferrer">Go to Homepage</a>
  </div>
</body>
</html>
